name: Release

# Push a tag such as v2.0.0 (matching <Version> in Directory.Build.props) to publish a GitHub release
# with portable x64 and ARM64 downloads. The release notes come from that version's CHANGELOG.md section.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        runtime: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Check the tag matches the project version
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = $props.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ("v$version" -ne '${{ github.ref_name }}') {
            throw "Tag ${{ github.ref_name }} doesn't match version $version in Directory.Build.props."
          }

      - name: Build, test and publish
        shell: pwsh
        run: ./build.ps1 -Portable -Runtime ${{ matrix.runtime }}

      - uses: actions/upload-artifact@v7
        with:
          name: portable-${{ matrix.runtime }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    runs-on: windows-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Extract release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $changelog = Get-Content CHANGELOG.md -Raw
          $pattern = "(?ms)^## \[$([regex]::Escape($version))\][^\n]*\n(.*?)(?=^## \[|\z)"
          $match = [regex]::Match($changelog, $pattern)
          $notes = if ($match.Success) { $match.Groups[1].Value.Trim() } else { "See CHANGELOG.md." }
          $notes += "`n`n---`n**Download:** ``TidyFlow-$version-x64-portable.zip`` for most PCs, ``-arm64-`` for Windows on ARM. Unzip and run ``TidyFlow.exe``; nothing to install. See the README for the SmartScreen prompt on first run."
          Set-Content release-notes.md $notes

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ github.ref_name }}' dist/*.zip --title "TidyFlow ${{ github.ref_name }}" --notes-file release-notes.md
