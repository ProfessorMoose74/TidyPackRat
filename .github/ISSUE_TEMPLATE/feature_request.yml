name: Feature request
description: Suggest an idea or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like TidyFlow to do?
      description: Describe the problem you're trying to solve, not just the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How might it work?
      description: Where in the app would it go? How do other tools handle it?
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you've tried instead?
